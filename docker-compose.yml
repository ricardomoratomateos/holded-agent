services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: holded-agent-backend-dev
    ports:
      - "3300:3300"
    env_file:
      - .env
    volumes:
      # Montar código fuente para hot reload
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      # Montar carpetas de datos persistentes
      - ./uploads:/app/uploads
      - ./data:/app/data
      # Excluir node_modules del host
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev:docker
    networks:
      - holded-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: holded-agent-frontend-dev
    ports:
      - "3301:5173"
    volumes:
      # Montar código fuente para hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      # Excluir node_modules del host
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3300
    networks:
      - holded-network
    depends_on:
      - backend

networks:
  holded-network:
    driver: bridge
