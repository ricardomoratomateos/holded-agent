services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: holded-agent-backend-dev
    ports:
      - "3300:3300"
      - "9229:9229"  # Puerto de debug
    env_file:
      - .env
    volumes:
      # Montar código fuente para hot reload
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      # Montar carpetas de datos persistentes
      - ./uploads:/app/uploads
      - ./data:/app/data
      # Excluir node_modules del host
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    command: npm run dev:docker:debug
    networks:
      - holded-network
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: holded-agent-frontend-dev
    ports:
      - "3301:5173"
    volumes:
      # Montar código fuente para hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      # Excluir node_modules del host
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3300
    networks:
      - holded-network
    depends_on:
      - backend

  browser-service:
    build:
      context: ./browser-service
      dockerfile: Dockerfile
    container_name: holded-agent-browser-service
    ports:
      - "3400:3400"
    environment:
      - NODE_ENV=production
    networks:
      - holded-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3400/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis para cache semántico de documentación
  redis:
    image: redis:7-alpine
    container_name: holded-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - holded-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  holded-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
