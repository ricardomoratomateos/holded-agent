version: '3.8'

services:
  backend:
    build: .
    container_name: holded-agent-backend
    restart: always
    ports:
      - "3300:3300"
    env_file: .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - holded-network
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=https://api-holded-agent.dewdewdewdewdew.com
    container_name: holded-agent-frontend
    restart: always
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=https://api-holded-agent.dewdewdewdewdew.com
    networks:
      - holded-network

  # Redis para cache semántico de documentación
  redis:
    image: redis:7-alpine
    container_name: holded-agent-redis-prod
    ports:
      - "127.0.0.1:6379:6379"  # Solo accesible desde localhost
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    restart: always
    networks:
      - holded-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  holded-network:
    driver: bridge

volumes:
  redis-data:
    driver: local